# O pipeline declarativo do call_first. Hoje só a bronze dos formulários (Auto Loader sobre o Volume raw).

resources:
  pipelines:
    call_first_etl:
      name: call_first_etl
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: "../src/call_first_etl"

      configuration:
        call_first.catalog: ${var.catalog}
        call_first.schema_bronze: ${var.schema_bronze}

      libraries:
        - glob:
            include: ../src/call_first_etl/transformations/**
