# O pipeline declarativo do call_first: a bronze dos formulários (Auto Loader sobre o Volume raw)
# e a silver inteira (schema silver, nomes totalmente qualificados).

resources:
  pipelines:
    call_first_etl:
      name: call_first_etl
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: "../src/call_first_etl"

      configuration:
        call_first.catalog: ${var.catalog}
        call_first.schema_bronze: ${var.schema_bronze}
        call_first.schema_silver: ${var.schema_silver}

      libraries:
        - glob:
            include: ../src/call_first_etl/transformations/**
