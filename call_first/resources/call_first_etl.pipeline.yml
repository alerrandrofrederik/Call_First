# The main pipeline for call_first

resources:
  pipelines:
    call_first_etl:
      name: call_first_etl
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: "../src/call_first_etl"

      libraries:
        - glob:
            include: ../src/call_first_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
