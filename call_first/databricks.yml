# This is a Declarative Automation Bundle definition for call_first.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: call_first
  uuid: 821558e7-3138-4343-9897-7e12eb139634

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema_bronze:
    description: Schema da camada bronze (dados brutos)
    default: bronze
  schema_silver:
    description: Schema da camada silver (dados tratados)
    default: silver
  schema_gold:
    description: Schema da camada gold (dados de negocio)
    default: gold

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com
    variables:
      catalog: call_first
  prod:
    mode: production
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/alerrandrofrederik@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alerrandrofrederik@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: call_first
    permissions:
      - user_name: alerrandrofrederik@gmail.com
        level: CAN_MANAGE
